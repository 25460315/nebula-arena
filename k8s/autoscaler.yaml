apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: nebula-autoscaler
  namespace: default
spec:
  fleetName: nebula-fleet
  policy:
    type: Buffer
    buffer:
      bufferSize: 20%
      minReplicas: 3
      maxReplicas: 200
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matchmaker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matchmaker
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # evita subir y bajar en ciclos (flapping)
